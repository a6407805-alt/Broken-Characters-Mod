# Builds the Broken Characters Mod on GitHub's servers every time code is pushed, then publishes the result as the
# "latest" release: Broken-Characters-Mod.zip. Friends just run "Update Broken Characters.bat" to get it.
name: Build Broken Characters Mod

on:
  push:
    branches: [ main ]
  pull_request:          # pull requests (from branches or forks) are built and tested, never published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build the Duelist (src/Duelist)
        run: dotnet build src/Duelist/DuelistMod.csproj -c Release -nologo

      - name: Build the other mods from source (src/<Mod>/*.csproj)
        # Each mod whose source lives in src/<Mod>/ is compiled here and its fresh dll replaces mods/<Mod>/.
        # A mod that fails to build keeps its last good dll, so one broken mod never blocks the pack.
        run: |
          shopt -s nullglob
          for proj in src/*/*.csproj; do
            mod=$(basename "$(dirname "$proj")")
            [ "$mod" = "Duelist" ] && continue   # built above; it ships in its own Duelist folder
            name=$(grep -oP '(?<=<AssemblyName>)[^<]+' "$proj" | head -1 || true)
            [ -z "$name" ] && name=$(basename "$proj" .csproj)
            echo "== building $mod ($name)"
            if dotnet build "$proj" -c Release -nologo -o "build/$mod"; then
              mkdir -p "mods/$mod"
              for ext in dll pdb deps.json; do
                if [ -f "build/$mod/$name.$ext" ]; then cp "build/$mod/$name.$ext" "mods/$mod/"; fi
              done
              echo "::notice::$mod built from source"
            else
              echo "::error::$mod failed to build - the pack keeps its previous $mod dll"
            fi
          done

      - name: Package Broken-Characters-Mod.zip
        run: bash release/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Broken-Characters-Mod
          path: Broken-Characters-Mod.zip

  test-installer:
    # Runs INSTALL on a real Windows machine against a dummy game folder, twice (fresh, then re-run),
    # so a broken installer never reaches the release.
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Broken-Characters-Mod
      - name: Updater can download the pack (with a key, like a private repo, and without)
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive Broken-Characters-Mod.zip upd
          & .\upd\update.ps1 -Key $env:GH_TOKEN -DownloadOnly -OutDir (Join-Path $env:RUNNER_TEMP 'u1')
          if (-not (Test-Path (Join-Path $env:RUNNER_TEMP 'u1\pack.zip'))) { throw 'keyed download failed' }
          Remove-Item upd -Recurse -Force

      - name: Install into a dummy game folder
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:RUNNER_TEMP 'install.log'
          Start-Transcript $log | Out-Null
          try {
          Expand-Archive Broken-Characters-Mod.zip pack
          $game = Join-Path $env:RUNNER_TEMP 'Risk of Rain 2'
          New-Item -ItemType Directory $game | Out-Null
          Set-Content (Join-Path $game 'Risk of Rain 2.exe') 'dummy'
          & .\pack\install.ps1 -GameDir $game -SkipExtras
          & .\pack\install.ps1 -GameDir $game -SkipExtras
          $must = 'winhttp.dll', 'BepInEx\core\BepInEx.dll', 'BepInEx\plugins\Duelist\DuelistMod.dll',
                  'BepInEx\plugins\RiskofThunder-R2API_Core\manifest.json', 'BepInEx\plugins\WilburMod\WilburMod.dll'
          $bad = $must | Where-Object { -not (Test-Path (Join-Path $game $_)) }
          Get-ChildItem (Join-Path $game 'BepInEx') -Recurse -Depth 2 | Select-Object -ExpandProperty FullName
          foreach ($d in 'plugins', 'patchers') { Write-Host "== $d"; Get-ChildItem (Join-Path $game "BepInEx\$d") -Name -ErrorAction SilentlyContinue }
          Get-ChildItem (Join-Path $game 'BepInEx') -Recurse -Filter *.dll | Where-Object { $_.FullName -match 'HookGen|FixPlugin|Seekers' } | Select-Object -ExpandProperty FullName
          if ($bad) { throw "Missing after install: $($bad -join ', ')" }
          $dlls = Get-ChildItem (Join-Path $game 'BepInEx') -Recurse -Filter *.dll
          foreach ($n in 'R2API.Core.dll','R2API.ContentManagement.dll','R2API.Language.dll','R2API.Networking.dll','R2API.Prefab.dll','R2API.Items.dll','R2API.RecalculateStats.dll','RoR2BepInExPack.dll','MiscFixes.dll','FixPluginTypesSerialization.dll','BepInEx.MonoMod.HookGenPatcher.dll','SeekersPatcher.dll') {
            if (-not ($dlls | Where-Object Name -eq $n)) { throw "Library dll missing: $n" }
          }
          foreach ($n in 'FixPluginTypesSerialization.dll','BepInEx.MonoMod.HookGenPatcher.dll','SeekersPatcher.dll') {
            if (-not (Get-ChildItem (Join-Path $game 'BepInEx\patchers') -Recurse -Filter $n -ErrorAction SilentlyContinue)) { throw "Patcher not under BepInEx\patchers: $n" }
          }
          if (-not (Test-Path (Join-Path $game 'doorstop_config.ini'))) { throw 'doorstop_config.ini missing next to the exe' }
          Write-Host 'Installer OK'
          } catch {
            Write-Host "FAILED: $($_.Exception.Message) at $($_.InvocationInfo.PositionMessage)"
            Stop-Transcript | Out-Null
            $tail = (Get-Content $log | Select-Object -Last 60) -join '%0A'
            Write-Host "::error::$tail"
            exit 1
          }

      - name: Steam Play button (opt-in) is set and undone in a fake Steam account
        shell: pwsh
        run: |
          $steam = Join-Path $env:RUNNER_TEMP 'FakeSteam'
          $cfg = Join-Path $steam 'userdata\123\config'
          New-Item -ItemType Directory -Force -Path $cfg | Out-Null
          $vdf = Join-Path $cfg 'localconfig.vdf'
          # realistic nesting, plus a decoy "632360" block earlier in the file that must NOT be edited
          Set-Content $vdf "`"UserLocalConfigStore`"`n{`n`t`"apptickets`"`n`t{`n`t`t`"632360`"`n`t`t{`n`t`t`t`"x`"`t`"1`"`n`t`t}`n`t}`n`t`"Software`"`n`t{`n`t`t`"Valve`"`n`t`t{`n`t`t`t`"Steam`"`n`t`t`t{`n`t`t`t`t`"apps`"`n`t`t`t`t{`n`t`t`t`t`t`"632360`"`n`t`t`t`t`t{`n`t`t`t`t`t`t`"LastPlayed`"`t`t`"1`"`n`t`t`t`t`t}`n`t`t`t`t}`n`t`t`t}`n`t`t}`n`t}`n}"
          $exe = Join-Path $env:RUNNER_TEMP 'Broken-Characters-Mod.exe'; Set-Content $exe 'x'
          Expand-Archive Broken-Characters-Mod.zip steamtest -Force
          pwsh -NoProfile -File steamtest\install.ps1 -SteamPlayOnly -LauncherPath $exe -SetSteamPlay -SteamRoot $steam
          $t = Get-Content $vdf -Raw
          if ($t -notmatch '"LaunchOptions"\s+"\\"[^"]*Broken-Characters-Mod\.exe\\" %command%"') { $t; throw 'LaunchOptions not set' }
          if (-not (Test-Path "$vdf.bc-backup")) { throw 'no backup' }
          if ($t -match '(?s)"apptickets".{0,40}LaunchOptions') { $t; throw 'edited the decoy block' }
          if ($t -notmatch '(?s)"apps"\s*\{\s*"632360"\s*\{\s*"LaunchOptions"') { $t; throw 'not in the apps section' }
          pwsh -NoProfile -File steamtest\install.ps1 -SteamPlayOnly -LauncherPath $exe -SetSteamPlay -SteamRoot $steam
          if (([regex]::Matches((Get-Content $vdf -Raw), 'LaunchOptions')).Count -ne 1) { throw 'set twice' }
          pwsh -NoProfile -File steamtest\install.ps1 -SteamPlayOnly -UnsetSteamPlay -SteamRoot $steam
          if ((Get-Content $vdf -Raw) -match 'Broken-Characters') { throw 'not cleared' }
          Write-Host 'Steam Play opt-in: set, idempotent, undone - OK'

  launcher:
    # The Warframe-style launcher (launcher/): a self-contained Windows exe. A failure here never blocks the pack.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Merge the per-mod roster cards (launcher/cards/*.json) into roster.json
        shell: bash
        run: |
          py=$(command -v python3 || command -v python)
          "$py" release/merge_roster.py
      - name: Build Broken-Characters-Mod.exe
        run: dotnet publish launcher/BrokenCharactersMod.csproj -c Release -o launcher-out -nologo
      - uses: actions/upload-artifact@v4
        with:
          name: Launcher
          path: launcher-out/Broken-Characters-Mod.exe
      - name: Screenshot the launcher (preview mode, installs nothing)
        continue-on-error: true
        shell: pwsh
        run: |
          $out = Join-Path $pwd 'launcher-preview.png'
          $p = Start-Process launcher-out\Broken-Characters-Mod.exe -ArgumentList '--screenshot', "`"$out`"" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'launcher did not exit' }
          if (-not (Test-Path $out)) { throw 'no screenshot' }
      - name: Screenshot the Creator (publish) window with demo data
        continue-on-error: true
        shell: pwsh
        run: |
          $out = Join-Path $pwd 'publish-preview.png'
          $p = Start-Process launcher-out\Broken-Characters-Mod.exe -ArgumentList '--screenshot-publish', "`"$out`"" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'publish window did not exit' }
          if (-not (Test-Path $out)) { throw 'no publish screenshot' }
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Launcher-Preview
          path: |
            launcher-preview.png
            publish-preview.png

  publish:
    needs: [test-installer, launcher]
    if: always() && github.event_name != 'pull_request' && needs.test-installer.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            launcher
            release
      - name: Merge the roster cards (launchers download roster.json from the release)
        run: |
          python3 release/merge_roster.py
          cp launcher/roster.json roster.json
      - uses: actions/download-artifact@v4
        with:
          name: Broken-Characters-Mod
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Launcher
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Launcher-Preview
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          # Older updaters (and the first install guide) download the pack's previous name, so it's published too.
          cp Broken-Characters-Mod.zip Broken-Characters-Collection.zip
          files="Broken-Characters-Mod.zip Broken-Characters-Collection.zip"
          [ -f Broken-Characters-Mod.exe ] && files="$files Broken-Characters-Mod.exe"
          [ -f launcher-preview.png ] && files="$files launcher-preview.png"
          [ -f publish-preview.png ] && files="$files publish-preview.png"
          [ -f roster.json ] && files="$files roster.json"
          gh release create latest $files \
            --title "Broken Characters Mod (latest build)" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. Easiest: run Broken-Characters-Mod.exe (the launcher). Or download Broken-Characters-Mod.zip, extract it and run INSTALL.bat. (Broken-Characters-Collection.zip is the same file under its old name, for older updaters.)" \
            --target "$GITHUB_SHA" --latest -R "$GITHUB_REPOSITORY"
